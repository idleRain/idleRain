    <path d="M940,30 L940,15 L925,15"><animate attributeName="stroke" values="#ff00e5;#00ff88;#ff00e5" dur="4s" repeatCount="indefinite"/></path>
    <path d="M20,140 L20,155 L35,155"><animate attributeName="stroke" values="#00ff88;#00f0ff;#00ff88" dur="4s" repeatCount="indefinite"/></path>
    <path d="M940,140 L940,155 L925,155"><animate attributeName="stroke" values="#00f0ff;#ff00e5;#00f0ff" dur="4s" repeatCount="indefinite"/></path>
