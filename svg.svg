  <text x="480" y="95" text-anchor="middle" font-size="72" font-weight="900" font-family="monospace" letter-spacing="8" fill="#00f0ff" opacity="0.04">小孩子不懂事写着玩的</text>
  <text x="480" y="95" text-anchor="middle" font-size="70" font-weight="900" font-family="monospace" letter-spacing="8" fill="#ff00e5" opacity="0.06">小孩子不懂事写着玩的</text>
  <text x="480" y="95" text-anchor="middle" font-size="66" font-weight="900" font-family="monospace" letter-spacing="8" fill="#00f0ff" opacity="0.08">小孩子不懂事写着玩的</text>
  <text x="480" y="95" text-anchor="middle" font-size="64" font-weight="900" font-family="monospace" letter-spacing="8" fill="#ff00e5" opacity="0.1">小孩子不懂事写着玩的</text>
