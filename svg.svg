<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff00e5;#00ff88;#00f0ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#ff00e5">
        <animate attributeName="stop-color" values="#ff00e5;#00ff88;#00f0ff;#ff00e5" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#00f0ff;#ff00e5;#00ff88" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff00e5;#00ff88;#00f0ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <animate attributeName="x1" values="0%;100%;0%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff00e5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

